<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 장보기</title>
<style>
  :root {
    --bg: #eef7ef;
    --card: #ffffff;
    --text: #1f3a29;
    --muted: #6b8574;
    --accent: #2f9e55;
    --accent-soft: #d6f0dd;
    --line: #e2eee5;
    --danger: #d0574f;
    --shadow: 0 2px 10px rgba(31, 90, 50, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }

  header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .progress-text { color: var(--muted); font-size: 0.95rem; }
  .bar { height: 10px; background: var(--accent-soft); border-radius: 99px; margin: 8px 0 20px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s; }

  .card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }

  form.add { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }
  form.add input, form.add select {
    font: inherit; padding: 10px 12px; border: 1.5px solid var(--line);
    border-radius: 12px; background: #fbfefb; color: var(--text); min-width: 0;
  }
  form.add input:focus, form.add select:focus { outline: none; border-color: var(--accent); }
  form.add select { grid-column: 1; }
  form.add button {
    grid-column: 2; font: inherit; font-weight: 700; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  form.add button:hover { filter: brightness(1.05); }

  .cat h2 { margin: 0 0 6px; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
  .cat h2 .count { margin-left: auto; font-size: 0.85rem; font-weight: 400; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }

  .check {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--accent); background: #fff; cursor: pointer;
    display: grid; place-items: center; color: #fff; font-weight: 700; padding: 0;
  }
  li.done .check { background: var(--accent); }
  .label { flex: 1; cursor: pointer; word-break: break-all; }
  .qty { color: var(--muted); font-size: 0.9rem; }
  li.done .label { text-decoration: line-through; color: var(--muted); }
  .del {
    flex: none; border: 0; background: none; color: var(--muted); font-size: 1.1rem;
    cursor: pointer; width: 30px; height: 30px; border-radius: 8px;
  }
  .del:hover { color: var(--danger); background: #fbeceb; }

  .empty { text-align: center; color: var(--muted); padding: 28px 0; }
  .clear {
    display: block; width: 100%; font: inherit; padding: 12px; margin-top: 6px;
    border: 1.5px dashed var(--accent); border-radius: 14px; background: transparent;
    color: var(--accent); font-weight: 700; cursor: pointer;
  }
  .clear:hover { background: var(--accent-soft); }
  .clear:disabled { opacity: .4; cursor: default; background: transparent; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 우리 집 장보기</h1>
    <div class="progress-text" id="progressText"></div>
    <div class="bar"><div id="bar"></div></div>
  </header>

  <form class="add card" id="addForm" autocomplete="off">
    <input id="name" placeholder="무엇을 살까요? (예: 두부)" required>
    <input id="qty" placeholder="수량">
    <select id="cat"></select>
    <button type="submit">추가</button>
  </form>

  <div id="list"></div>

  <button class="clear" id="clearBtn">다 산 것 비우기</button>
</div>

<script>
  const CATEGORIES = [
    { id: "veg", name: "채소·과일", icon: "🥬" },
    { id: "meat", name: "육류·생선", icon: "🥩" },
    { id: "dairy", name: "유제품·계란", icon: "🥛" },
    { id: "snack", name: "가공식품·간식", icon: "🍞" },
    { id: "home", name: "생활용품", icon: "🧻" },
    { id: "etc", name: "기타", icon: "📦" },
  ];
  const KEY = "shopping-list-v1";
  const SAMPLE = [
    { name: "양파", qty: "1망", cat: "veg" },
    { name: "사과", qty: "5개", cat: "veg" },
    { name: "돼지고기 앞다리살", qty: "600g", cat: "meat" },
    { name: "우유", qty: "1개", cat: "dairy" },
    { name: "계란", qty: "1판", cat: "dairy" },
    { name: "휴지", qty: "1묶음", cat: "home" },
  ];

  let items = load();

  function load() {
    try {
      const saved = localStorage.getItem(KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return SAMPLE.map((s, i) => ({ ...s, id: Date.now() + i, done: false }));
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }

  const $ = (id) => document.getElementById(id);
  $("cat").innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join("");

  function esc(s) {
    return s.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  function render() {
    const total = items.length;
    const done = items.filter(i => i.done).length;
    $("progressText").textContent = total ? `${total}개 중 ${done}개 담음` : "목록이 비어 있어요";
    $("bar").style.width = total ? (done / total * 100) + "%" : "0";
    $("clearBtn").disabled = done === 0;

    if (!total) {
      $("list").innerHTML = `<div class="card empty">위에서 살 것을 추가해 보세요 🌱</div>`;
      return;
    }

    $("list").innerHTML = CATEGORIES.map(c => {
      const group = items.filter(i => i.cat === c.id);
      if (!group.length) return "";
      // 안 산 것 먼저, 산 것은 아래로
      group.sort((a, b) => a.done - b.done);
      const left = group.filter(i => !i.done).length;
      return `
        <section class="card cat">
          <h2>${c.icon} ${c.name}<span class="count">${left ? left + "개 남음" : "완료 ✓"}</span></h2>
          <ul>${group.map(i => `
            <li class="${i.done ? "done" : ""}" data-id="${i.id}">
              <button class="check" data-act="toggle" aria-label="체크">${i.done ? "✓" : ""}</button>
              <span class="label" data-act="toggle">${esc(i.name)}${i.qty ? ` <span class="qty">· ${esc(i.qty)}</span>` : ""}</span>
              <button class="del" data-act="del" aria-label="삭제">✕</button>
            </li>`).join("")}
          </ul>
        </section>`;
    }).join("");
  }

  $("list").addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    const li = e.target.closest("li");
    if (!act || !li) return;
    const id = Number(li.dataset.id);
    if (act === "toggle") {
      const it = items.find(i => i.id === id);
      it.done = !it.done;
    } else if (act === "del") {
      items = items.filter(i => i.id !== id);
    }
    save(); render();
  });

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("name").value.trim();
    if (!name) return;
    items.push({ id: Date.now(), name, qty: $("qty").value.trim(), cat: $("cat").value, done: false });
    $("name").value = ""; $("qty").value = "";
    $("name").focus();
    save(); render();
  });

  $("clearBtn").addEventListener("click", () => {
    const n = items.filter(i => i.done).length;
    if (!n || !confirm(`체크한 ${n}개 항목을 목록에서 지울까요?`)) return;
    items = items.filter(i => !i.done);
    save(); render();
  });

  render();
</script>
</body>
</html>
